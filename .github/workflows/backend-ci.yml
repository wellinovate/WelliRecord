name: Backend CI

on:
  push:
    branches:
      - staging

jobs:
  test-build-health-merge:
    runs-on: ubuntu-latest
    env:
      PORT: 3001
      NODE_ENV: staging
      DATABASE: ${{ secrets.DATABASE }}
      TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
      TERMII_BASE_URL: ${{ secrets.TERMII_BASE_URL }}
      TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
      TERMII_OTP_CHANNEL: ${{ secrets.TERMII_OTP_CHANNEL }}

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node setup
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run tests
      - name: Run tests
        run: npm test --if-present

      # 5. Build project
      - name: Build project
        run: npm run build --if-present

      # 6. Start server in background
      - name: Start server
        run: |
          npm run start > server.log 2>&1 &
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Server is up!"
              break
            fi
            echo "Waiting 2s..."
            sleep 2
          done

      # 7. Health check
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed!"
            echo "------ Server Logs ------"
            cat server.log
            exit 1
          fi

      # 8. Auto-merge staging into main
      - name: Merge staging into main
        if: success()
        uses: devops-infra/action-pull-request@v0.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: staging
          target_branch: main
          title: "Auto-merge staging → main after health check"
          body: "Merged automatically as health check passed"